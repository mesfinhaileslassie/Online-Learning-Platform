<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - EthioSkillFactory</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <div id="message"></div>
            <form id="registerForm">
                <input type="text" id="full_name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="tel" id="phone" placeholder="Phone (optional)">
                <input type="password" id="password" placeholder="Password (min 6 characters)" required>
                <input type="password" id="confirm_password" placeholder="Confirm Password" required>
                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('full_name', document.getElementById('full_name').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('phone', document.getElementById('phone').value);
            formData.append('password', document.getElementById('password').value);
            formData.append('confirm_password', document.getElementById('confirm_password').value);
            
            const response = await fetch('/ethioskillfactoryV2/api/auth/register.php', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            
            if (result.success) {
                document.getElementById('message').innerHTML = '<div class="success">' + result.message + '</div>';
                setTimeout(() => {
                    window.location.href = result.redirect;
                }, 2000);
            } else {
                document.getElementById('message').innerHTML = '<div class="error">' + result.message + '</div>';
            }
        });
    </script>
</body>
</html>
