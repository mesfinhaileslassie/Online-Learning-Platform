<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - EthioSkillFactory</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Login to EthioSkillFactory</h2>
            <div id="message"></div>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="register.html">Register</a></p>
            <div class="demo">
                <strong>Demo:</strong> student@example.com / password123
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const formData = new URLSearchParams();
            formData.append('email', email);
            formData.append('password', password);
            
            try {
                const response = await fetch('/ethioskillfactoryV2/api/auth/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                const text = await response.text();
                console.log('Raw response:', text);
                
                let result;
                try {
                    result = JSON.parse(text);
                } catch(e) {
                    document.getElementById('message').innerHTML = '<div class="error">❌ Server error. Please check the console.</div>';
                    console.error('JSON parse error:', text);
                    return;
                }
                
                if (result.success === true) {
                    localStorage.setItem('user', JSON.stringify(result.user));
                    document.getElementById('message').innerHTML = '<div class="success">✅ Login successful! Redirecting...</div>';
                    setTimeout(() => {
                        window.location.href = result.redirect;
                    }, 1000);
                } else {
                    document.getElementById('message').innerHTML = '<div class="error">❌ ' + result.message + '</div>';
                }
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('message').innerHTML = '<div class="error">❌ Error: ' + error.message + '</div>';
            }
        });
    </script>
</body>
</html>
