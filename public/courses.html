<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Courses - EthioSkillFactory</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Our Courses</h1>
        <div id="courses-list" class="courses-grid"></div>
    </div>

    <script>
        async function loadCourses() {
            try {
                const response = await fetch('/ethioskillfactoryV2/api/courses/list.php');
                const data = await response.json();
                
                if (data.success && data.courses.length > 0) {
                    const container = document.getElementById('courses-list');
                    container.innerHTML = data.courses.map(course => `
                        <div class="course-card">
                            <h3>${escapeHtml(course.title)}</h3>
                            <p>${escapeHtml(course.description.substring(0, 100))}...</p>
                            <div class="course-meta">
                                <span>👨‍🏫 ${escapeHtml(course.instructor_name)}</span>
                                <span>📊 ${course.level}</span>
                            </div>
                            <div class="price">${course.price_formatted}</div>
                            <a href="course-details.html?id=${course.id}" class="btn btn-primary">View Details</a>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('courses-list').innerHTML = '<p>No courses available yet.</p>';
                }
            } catch (error) {
                console.error('Error loading courses:', error);
                document.getElementById('courses-list').innerHTML = '<p>Error loading courses. Please try again.</p>';
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadCourses();
    </script>
</body>
</html>
